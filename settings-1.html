<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Settings - KoGaRevival - A place to keep the KoGaMa memorial alive!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="settings-box">
        <h1>Background</h1>
        
        <div class="control-group">
            <label>Color 1:</label>
            <input type="color" id="color1" value="#150e2f">
        </div>

        <div class="control-group">
            <label>Color 2:</label>
            <input type="color" id="color2" value="#005e69">
        </div>

        <div class="control-group">
            <label>Direction (for example 30deg):</label>
            <input type="text" id="angle" value="dir">
        </div>

        <button id="saveBtn">Save</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
